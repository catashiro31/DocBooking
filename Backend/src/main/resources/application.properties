spring.application.name=Backend

# RẤT QUAN TRỌNG: Render sẽ tự động cấp một cổng (port) ngẫu nhiên thông qua biến PORT. 
# Nếu không có biến này, Spring Boot cứ chạy cổng 5020 sẽ bị Render báo lỗi Timeout và sập.
server.port=${PORT:5020}

# --- DATABASE Configuration ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA Config
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# --- CLOUDINARY Configuration ---
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Upload Size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- JWT Configuration ---
security.jwt.secret-key=${JWT_SECRET}
security.jwt.expiration-time=86400000

# --- GMAIL Configuration ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- CẤU HÌNH HIKARI (Rất tốt cho Supabase, bạn cấu hình chuẩn rồi, cứ giữ nguyên) ---
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.keepalive-time=30000